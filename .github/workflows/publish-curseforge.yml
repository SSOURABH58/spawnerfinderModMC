name: Publish to CurseForge

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - beta
          - alpha
      changelog:
        description: 'Changelog description'
        required: false
        default: 'Updated SpawnerFinder to Minecraft 26.3'
        type: string
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build mod
        run: ./gradlew build

      - name: Upload to CurseForge
        uses: KirigamiMC/curseforge-upload@v1
        with:
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          project_id: '1386326'
          game_endpoint: 'minecraft'
          file_path: 'build/libs/spawnerfinder-2.3.0.jar'
          game_versions: '26.3,Fabric'
          release_type: ${{ github.event.inputs.release_type || 'release' }}
          changelog: ${{ github.event.inputs.changelog || github.event.release.body || 'Updated SpawnerFinder to Minecraft 26.3' }}
