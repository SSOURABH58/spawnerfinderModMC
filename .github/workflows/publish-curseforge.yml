name: Publish to CurseForge

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (release, beta, alpha)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - beta
          - alpha
      changelog:
        description: 'Changelog description'
        required: false
        default: 'Updated SpawnerFinder to Minecraft 26.3'
        type: string
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build mod
        run: ./gradlew build

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3
        with:
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-project-id: '1386326'
          files: 'build/libs/spawnerfinder-2.3.0.jar'
          game-versions: |
            26.3
            Fabric
          release-type: ${{ github.event.inputs.release_type || 'release' }}
          changelog: ${{ github.event.inputs.changelog || github.event.release.body || 'Updated SpawnerFinder to Minecraft 26.3' }}
